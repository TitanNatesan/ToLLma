[project]
name = "tollms"
version = "0.1.0"
description = "ToLLma — Toll to your Large Language Models & Agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "cryptography>=42",
    "pyjwt>=2.8",
    "email-validator>=2.0",
    "argon2-cffi>=23.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "redis>=5.0",
    "boto3>=1.34",
    "google-auth>=2.0",
    "pypdf>=6.0",
    "python-multipart>=0.0.18",
    "fpdf2>=2.8",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "psutil>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis>=2.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
