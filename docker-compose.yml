services:
  postgres:
    image: postgres:17
    container_name: tollms-postgres
    env_file: [ .env ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: [ "${POSTGRES_PORT}:5432" ]
    volumes: [ postgres_data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  backend:
    build: { context: ./backend }
    container_name: tollms-backend
    env_file: [ .env ]
    restart: unless-stopped
    ports: [ "${BACKEND_PORT}:8000" ]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    volumes: [ "./backend:/app" ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\"" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s

  laya:
    build: { context: ./laya }
    container_name: tollms-laya
    restart: unless-stopped
    # Backend reaches Laya over the compose network; the host port is only a
    # loopback debugging affordance, never a public exposure.
    ports: [ "127.0.0.1:8001:8001" ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\"" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s

  valkey:
    image: valkey/valkey:8@sha256:3fbd2e3e4b6e85e046c1e7c215e8f79087bc0357789184305806664e320996f3
    container_name: tollms-valkey
    restart: unless-stopped
    ports: [ "${VALKEY_PORT}:6379" ]
    volumes: [ valkey_data:/data ]
    command: [ valkey-server, --appendonly, "yes" ]
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  frontend:
    build: { context: ./frontend }
    container_name: tollms-frontend
    restart: unless-stopped
    env_file: [ .env ]
    environment:
      BACKEND_URL: http://backend:8000
    ports: [ "${FRONTEND_PORT}:3000" ]
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - "./frontend:/app"
      - "frontend_node_modules:/app/node_modules"
      # Host-owned .next breaks Turbopack writes through Desktop file sharing.
      - "frontend_next:/app/.next"

volumes:
  postgres_data:
  valkey_data:
  frontend_node_modules:
  frontend_next:
