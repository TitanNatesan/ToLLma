# Trust security pipeline (MODULE 6 / §9).
#
# Free tools only: gitleaks, semgrep, osv-scanner, trivy, pip-licenses /
# license-checker, syft (SBOM on release). No paid services.
#
# Isolation from deploy-pages.yml: separate file, separate workflow name,
# separate concurrency group, no `pages` environment, triggers do not depend
# on landing/**. Least privilege: contents:read globally, security-events:write
# only on SARIF-upload jobs.
#
# Gate policy (see docs/security/devsecops/PIPELINE.md):
#   BLOCKING: gitleaks (any finding), osv-scanner HIGH/CRITICAL with fix,
#             trivy vuln/secret HIGH/CRITICAL, license blocklist hit.
#   NON-BLOCKING (continue-on-error + SARIF/summary): semgrep (first cycle,
#             becomes blocking on ERROR after baseline), trivy misconfig,
#             THIRD_PARTY_NOTICES freshness.

name: Trust security pipeline

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Weekly Monday 06:00 UTC — catches newly disclosed CVEs, not just diffs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "trust-security-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks, blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for scheduled scans)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Full-history on schedule/dispatch, diff-aware on PR/push by default.

  semgrep:
    name: SAST (semgrep, non-blocking first cycle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    continue-on-error: true # First cycle: observe only. Flip to blocking on
      # ERROR severity after baseline is tuned (see PIPELINE.md §why).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          # `auto` = default rulesets for the repo's languages (python, js/ts).
          config: auto
          generateSarif: "true"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  osv:
    name: Dependency CVEs (osv-scanner, blocking HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv (for frozen backend export)
        uses: astral-sh/setup-uv@v4
      - name: Install osv-scanner
        run: pip install osv-scanner
      - name: Export backend requirements (frozen, no install)
        run: uv export --frozen --no-hashes --format requirements.txt --output /tmp/backend-requirements.txt
        working-directory: backend
      - name: Scan (fail on HIGH/CRITICAL with a fix available)
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys
          out = subprocess.run(
              ["osv-scanner", "--lockfile", "/tmp/backend-requirements.txt:requirements.txt",
               "--lockfile", "frontend/package-lock.json:package-lock.json",
               "--format", "json"],
              capture_output=True, text=True)
          # osv-scanner exits nonzero when vulns found; parse stdout regardless.
          try:
              data = json.loads(out.stdout or "{}")
          except json.JSONDecodeError:
              print(out.stdout[-4000:]); print(out.stderr[-4000:], file=sys.stderr)
              sys.exit("osv-scanner output unparseable")
          blocking, advisory = [], []
          for res in data.get("results", []):
              for pkg in res.get("packages", []):
                  name = pkg.get("package", {}).get("name", "?")
                  for v in pkg.get("vulnerabilities", []):
                      sev = [s for s in v.get("severity", [])
                             if s.get("type") in ("CVSS_V3", "CVSS_V4")]
                      score = max([s.get("score", "") for s in sev] or [""])
                      high = isinstance(score, str) and score[:1] in ("7", "8", "9") \
                          or score == "10" or str(score).startswith("10")
                      fixed = any(e.get("fixed", "") for e in v.get("affected", []))
                      row = f"{v.get('id')} {name} score={score} fixed={fixed}"
                      (blocking if (high and fixed) else advisory).append(row)
          print("## osv-scanner advisory (all severities)", flush=True)
          print("\n".join(advisory) or "(none)")
          if blocking:
              print("## BLOCKING (HIGH/CRITICAL with fix available)", flush=True)
              print("\n".join(blocking))
              sys.exit(1)
          print("No blocking findings.")
          EOF

  trivy:
    name: Filesystem + config scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vuln + secret scan (blocking HIGH/CRITICAL)
        # TODO(Wave 3): pin to commit SHA after first green run.
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"
          skip-dirs: "node_modules,.next,landing/out,.venv,graphify-out"
      - name: Misconfig scan (non-blocking, SARIF)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          format: "sarif"
          output: "trivy-misconfig.sarif"
          skip-dirs: "node_modules,.next,landing/out,.venv,graphify-out"
      - name: Upload misconfig SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-misconfig.sarif
          category: trivy-misconfig

  license-check:
    name: License policy (blocking on blocklist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Backend license check (pip-licenses, ephemeral — not a project dep)
        run: |
          pip install pip-licenses
          pip install --quiet -e ./backend 2>/dev/null || pip install --quiet ./backend || true
          pip-licenses --format=json --output-file /tmp/backend-licenses.json
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path
          policy = Path("docs/opensource/LICENSE_POLICY.md").read_text()
          # Blocklist enforced exactly as documented in LICENSE_POLICY.md.
          # "gpl" substring covers GPL + AGPL. LGPL is review-list, NOT blocklist.
          data = json.loads(Path("/tmp/backend-licenses.json").read_text())
          hits = []
          for d in data:
              lic = str(d["License"]).lower()
              if "lgpl" in lic:
                  continue
              if any(b in lic for b in ["gpl", "sspl", "commons clause", "busl"]):
                  hits.append(f"{d['Name']} {d['Version']} ({d['License']})")
          if hits:
              print("BLOCKED licenses:\n" + "\n".join(hits)); sys.exit(1)
          print(f"Backend licenses OK ({len(data)} packages, none blocklisted).")
          EOF
      - name: Frontend license check (license-checker, ephemeral via npx)
        run: |
          cd frontend && npx -y license-checker --json --out /tmp/frontend-licenses.json
          python3 - <<'EOF'
          import json, sys
          data = json.load(open("/tmp/frontend-licenses.json"))
          hits = []
          for k, v in data.items():
              lic = str(v.get("licenses", "")).lower()
              if "lgpl" in lic:
                  continue
              if any(b in lic for b in ["gpl", "sspl", "commons clause", "busl"]):
                  hits.append(f"{k} ({v.get('licenses', '?')})")
          if hits:
              print("BLOCKED licenses:\n" + "\n".join(hits)); sys.exit(1)
          print(f"Frontend licenses OK ({len(data)} packages, none blocklisted).")
          EOF
      - name: THIRD_PARTY_NOTICES freshness (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          bash docs/opensource/generate-third-party-notices.sh --check
